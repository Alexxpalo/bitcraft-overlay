<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bitwasp Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { height: 100%; display: flex; flex-direction: column; }
    #app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #view-main { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #view-setup { display: flex; flex-direction: column; }
    .collapsible { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #update-banner {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; font-size: 11px;
      background: color-mix(in oklab, #3a86d8 18%, transparent);
      border-bottom: 1px solid color-mix(in oklab, #3a86d8 40%, transparent);
    }
    #update-banner span { flex: 1; color: var(--txt); }
    #update-banner button {
      font-size: 10px; padding: 2px 7px; border-radius: 4px; cursor: pointer;
      background: none; border: 1px solid var(--line); color: var(--dim2);
      font-family: var(--mono);
    }
    #update-banner button:first-of-type {
      background: #3a86d8; border-color: #3a86d8; color: #fff;
    }
    #update-banner button:first-of-type:hover { opacity: 0.85; }
    .cp-stage { margin-bottom: 1px; }
    .cp-shd {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 10px; font-size: 11px; font-weight: 700;
      color: var(--txt); background: var(--bg2); border-top: 1px solid var(--line);
    }
    .cp-sbadge { font-size: 9px; font-family: var(--mono); color: var(--dim2); background: var(--bg3); border-radius: 8px; padding: 1px 5px; }
    .cp-group { border-left: 2px solid var(--line); margin: 0 8px 3px 14px; }
    .cp-gtag { display: flex; align-items: center; gap: 4px; padding: 3px 7px; font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .cp-gbadge { font-size: 9px; font-family: var(--mono); color: var(--dim2); background: var(--bg3); border-radius: 6px; padding: 0 4px; }
    .cp-row { display: flex; align-items: center; justify-content: space-between; padding: 3px 7px; border-top: 1px solid color-mix(in oklab, var(--line) 25%, transparent); }
    .cp-name { flex: 1; font-size: 11px; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
    .cp-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .cp-qty { font-size: 11px; font-family: var(--mono); color: var(--dim2); }
    .cp-make { font-size: 10px; font-family: var(--mono); color: var(--good); }
    .cp-need { font-size: 11px; font-family: var(--mono); }
    .cp-need.ok { color: var(--good); }
    .cp-need.short { color: var(--bad); }
    .cp-goal-inp {
      width: 44px; font-size: 10px; font-family: var(--mono); text-align: right;
      background: var(--bg3); border: 1px solid var(--line); border-radius: 3px;
      color: var(--dim); padding: 1px 4px; -webkit-appearance: none; appearance: none;
    }
    .cp-goal-inp:focus { outline: none; border-color: var(--accent); color: var(--txt); }
    .cp-goal-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
    .cp-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 2px; }
    .cp-goal-hint { font-size: 10px; color: var(--dim2); font-family: var(--mono); }
    .cp-clear-goals {
      font-size: 10px; padding: 2px 8px; background: none; cursor: pointer;
      border: 1px solid var(--line); border-radius: 4px; color: var(--dim2); font-family: var(--mono);
    }
    .cp-clear-goals:hover { border-color: var(--bad); color: var(--bad); }
    .plan-editor { padding: 6px 8px 0; }
    .plan-search-inp { width: 100% !important; box-sizing: border-box !important; margin-bottom: 4px; flex: none !important; direction: ltr; text-align: left; }
    .plan-results { background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 6px; }
    .plan-result { display: flex; justify-content: space-between; align-items: center; padding: 5px 9px; cursor: pointer; border-top: 1px solid color-mix(in oklab, var(--line) 30%, transparent); font-size: 11px; color: var(--txt); }
    .plan-result:first-child { border-top: none; }
    .plan-result:hover { background: var(--bg3); }
    .plan-result-have { font-size: 10px; color: var(--dim2); font-family: var(--mono); flex-shrink: 0; margin-left: 8px; }
    .plan-items { background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 4px; }
    .plan-items-head { display: flex; justify-content: space-between; align-items: center; padding: 5px 9px; font-size: 11px; font-weight: 600; color: var(--txt); border-bottom: 1px solid var(--line); }
    .plan-item { display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-top: 1px solid color-mix(in oklab, var(--line) 25%, transparent); }
    .plan-item-name { flex: 1; font-size: 11px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-remove { background: none; border: none; color: var(--dim2); cursor: pointer; font-size: 11px; padding: 0 2px; flex-shrink: 0; line-height: 1; }
    .plan-remove:hover { color: var(--bad); }
    .plan-divider { font-size: 10px; font-weight: 700; color: var(--dim2); text-transform: uppercase; letter-spacing: .08em; padding: 6px 1px 3px; }
    .tk-setrow { display: flex; gap: 4px; padding: 7px 10px 6px; border-bottom: 1px solid var(--line); }
    .tk-inp { font-size: 10px !important; padding: 3px 7px !important; }
    .tk-setbtn { font-size: 10px; padding: 2px 8px; background: none; border: 1px solid var(--line); border-radius: 4px; color: var(--dim2); cursor: pointer; font-family: var(--mono); flex-shrink: 0; }
    .tk-setbtn:hover { border-color: var(--accent); color: var(--accent); }
    .tk-head { font-size: 10px; color: var(--dim2); padding: 6px 10px 4px; font-family: var(--mono); }
    .tk-head b { color: var(--good); }
    .tk-npc { display: flex; align-items: center; justify-content: space-between; font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; padding: 7px 2px 3px; }
    .tk-npc-count { font-size: 9px; font-weight: 600; color: var(--dim2); font-family: var(--mono); }
    .tasks { display: flex; flex-direction: column; gap: 5px; padding: 0 8px 8px; }
    .task-card { background: var(--bg2); border: 1px solid var(--line); border-left: 2px solid var(--craft); border-radius: 5px; padding: 6px 8px; }
    .task-card.done { opacity: .5; border-left-color: var(--good); }
    .task-desc { font-size: 11px; line-height: 1.3; margin-bottom: 4px; }
    .task-meta { display: flex; flex-direction: column; gap: 2px; font-size: 9.5px; font-family: var(--mono); }
    .task-need { color: var(--bad); }
    .task-reward { color: var(--good); }
  </style>
</head>
<body>
<div id="app">
  <!-- SETUP VIEW -->
  <div id="view-setup" style="display:none">
    <div class="dragbar" id="drag-bar-setup">
      <span class="logo">BITWASP</span>
      <span class="grow"></span>
      <button class="winbtn close" id="close-btn-setup">✕</button>
    </div>
    <div class="setup-content">
      <h2>Select Settlement</h2>
      <div class="search-row">
        <input class="inp" id="search-input" placeholder="Settlement name…" autocomplete="off">
        <button class="search-btn" id="search-btn">Find</button>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- MAIN VIEW -->
  <div id="view-main" style="display:none">
    <div class="dragbar" id="drag-bar-main">
      <span class="logo">BITWASP</span>
      <span class="settlement-name" id="settlement-label"></span>
      <span class="settle-tier" id="settlement-tier"></span>
      <span class="grow"></span>
      <button class="winbtn" id="collapse-btn" title="Collapse">▲</button>
      <button class="winbtn" id="min-btn" title="Minimize">–</button>
      <button class="winbtn close" id="close-btn-main" title="Close">✕</button>
    </div>

    <div id="update-banner" style="display:none">
      <span>Päivitys saatavilla: <strong id="update-ver"></strong></span>
      <button onclick="doInstallUpdate()">Asenna</button>
      <button onclick="dismissUpdate()">✕</button>
    </div>

    <div class="collapsible" id="main-collapsible">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="storage">Storage</button>
        <button class="tab" data-tab="builds">Builds</button>
        <button class="tab" data-tab="jobs">Jobs</button>
        <button class="tab" data-tab="tasks">Tasks</button>
        <button class="tab" data-tab="members">Members
          <span class="tab-badge" id="online-badge" style="display:none"></span>
        </button>
        <button class="tab" data-tab="settings">Settings</button>
      </div>

      <div class="content" id="tab-content"></div>

    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
// ─── State ────────────────────────────────────────────────────────────────
let settlement = getSettlement();
let activeTab = 'storage';
let storageMode = 'plan'; // 'plan' | 'items'
let allItems = null;   // flat item rows for all-items view
let chains = null;     // built chains for craft planner
let buildsData = null;
let jobsData = null;
let membersData = null;
let tasksData = null;  // null=idle, 'loading', 'noplayer', { tasks, items, cargo, skillMap, expiration }
let _skillMap = null;
let itemsMap = {};
let craftGoals = JSON.parse(localStorage.getItem('bc-goals') || '{}');
let _planSearchResults = null; // null=idle, 'loading', []=results

const fmt = n => Number(n).toLocaleString('en-US');
// esc() comes from common.js

// ─── Item icons ───────────────────────────────────────────────────────────
// iconAssetName comes in two shapes depending on endpoint:
//   inventories → "GeneratedIcons/Items/Bait"   (with prefix)
//   item search → "Items/FishFilet"             (without prefix)
// Normalize to a bare "Items/Bait" path, then serve the webp from:
const ICON_BASE = 'https://bitjita.com/GeneratedIcons/';
function normIcon(asset) {
  return String(asset || '').replace(/^\/+/, '').replace(/^GeneratedIcons\//, '');
}
function iconMap() { return JSON.parse(localStorage.getItem('bc-icons-map') || '{}'); }
function saveIcon(id, asset) {
  if (!id || !asset) return;
  const a = normIcon(asset);
  const m = iconMap();
  if (m[id] !== a) { m[id] = a; localStorage.setItem('bc-icons-map', JSON.stringify(m)); }
}
function iconImg(asset, cls = 'item-icon') {
  const a = normIcon(asset);
  if (!a) return `<span class="${cls} blank"></span>`;
  return `<img class="${cls}" src="${esc(ICON_BASE + a + '.webp')}" alt="" loading="lazy" onerror="this.classList.add('blank')">`;
}

// ─── Legacy chain cache (used by inventory view) ──────────────────────────
const CHAIN_KEY = 'bc-chain-v4';
function chainCache() { return JSON.parse(localStorage.getItem(CHAIN_KEY) || '{}'); }
function saveChainCache(c) { localStorage.setItem(CHAIN_KEY, JSON.stringify(c)); }

// ─── Full recipe cache (craft planner) ───────────────────────────────────
// { [id]: { name, tag, outputQty, ingredients:[{id,qty}] } | null }
const RECIPE_KEY = 'bc-recipe-v2'; // v2: recipes now also populate bc-icons-map
function recipeCache() { return JSON.parse(localStorage.getItem(RECIPE_KEY) || '{}'); }
function saveRecipeEntry(id, val) {
  const c = recipeCache(); c[id] = val;
  localStorage.setItem(RECIPE_KEY, JSON.stringify(c));
}

function _saveName(id, name) {
  if (!name) return;
  const nm = JSON.parse(localStorage.getItem('bc-items-map') || '{}');
  if (!nm[id]) { nm[id] = name; localStorage.setItem('bc-items-map', JSON.stringify(nm)); }
}

async function fetchRecipe(id) {
  const cache = recipeCache();
  if (id in cache) return cache[id];

  // Try items endpoint
  try {
    const j = await bitwasp(`items/${id}`);
    if (!j.error) {
      const name = j.item?.name || j.name || null;
      const tag  = j.item?.tag  || '';
      _saveName(id, name);
      saveIcon(id, j.item?.iconAssetName);
      const recipes = j.craftingRecipes || [];
      let result;
      if (recipes.length > 0) {
        const stacks = (recipes[0].consumedItemStacks || [])
          .filter(s => (s.discovery_score ?? 1) > 0 && s.item_id);
        if (stacks.length > 0) {
          result = {
            name, tag,
            outputQty: recipes[0].producedQuantity || 1,
            ingredients: stacks.map(s => ({ id: String(s.item_id), qty: s.quantity || 1 }))
          };
        }
      }
      if (!result) result = { name, tag, outputQty: 1, ingredients: [] };
      saveRecipeEntry(id, result);
      return result;
    }
  } catch(e) {}

  // Try cargo endpoint as fallback
  try {
    const j = await bitwasp(`cargo/${id}`);
    if (!j.error) {
      const name = j.cargo?.name || j.name || null;
      const tag  = j.cargo?.tag  || '';
      _saveName(id, name);
      saveIcon(id, j.cargo?.iconAssetName);
      const result = { name, tag, outputQty: 1, ingredients: [] };
      saveRecipeEntry(id, result);
      return result;
    }
  } catch(e) {}

  // Unknown item — save placeholder so we stop retrying
  const fallback = { name: null, tag: '', outputQty: 1, ingredients: [] };
  saveRecipeEntry(id, fallback);
  return fallback;
}

async function fetchChainMeta(id) {
  const cache = chainCache();
  if (cache[id] !== undefined) return cache[id];
  // Use fetchRecipe and map to old format for inventory chain building
  const r = await fetchRecipe(id);
  const meta = {
    tag: r?.tag || '',
    parentId: r?.ingredients?.[0]?.id || null,
    perCraft: r?.ingredients?.[0]?.qty || null
  };
  const fresh = chainCache(); fresh[id] = meta; saveChainCache(fresh);
  return meta;
}

// Fetch meta for all ids without recursion — one API call per uncached item.
async function batchFetchMeta(ids) {
  const BATCH = 6;
  for (let i = 0; i < ids.length; i += BATCH) {
    const slice = ids.slice(i, i + BATCH);
    const cache = chainCache();
    const uncached = slice.filter(id => cache[id] === undefined);
    if (uncached.length) await Promise.all(uncached.map(id => fetchChainMeta(id)));
  }
}

// Build chains using parentId links — groups items that share a refining chain.
// root = raw material (no recipe parent in inventory); chain goes root → … → most-refined.
function buildChainsFromMeta(items) {
  const meta = chainCache();
  const itemIds = new Set(items.map(i => i.id));

  // Map each item to its parent if that parent is also in inventory.
  const parent = {};
  for (const item of items) {
    const m = meta[item.id];
    if (m?.parentId && itemIds.has(m.parentId)) {
      parent[item.id] = m.parentId;
      item.perCraft = m.perCraft;
    }
  }

  // Roots are items that have children but no in-inventory parent.
  const hasChildren = new Set(Object.values(parent));
  const roots = items.filter(i => !parent[i.id] && hasChildren.has(i.id));

  return roots.map(root => {
    const chain = [root];
    let cur = root;
    for (;;) {
      const child = items.find(i => parent[i.id] === cur.id);
      if (!child) break;
      chain.push(child);
      cur = child;
    }
    const label = itemsMap[root.id] || root.name;
    return { label, stages: chain };
  }).sort((a, b) => a.label.localeCompare(b.label));
}

// ─── Craft planner engine ─────────────────────────────────────────────────
function computePlan(chains) {
  const recs = [];
  for (const chain of chains) {
    for (let i = 0; i < chain.stages.length - 1; i++) {
      const inp = chain.stages[i];
      const out = chain.stages[i + 1];
      const perCraft = out.perCraft;
      let convertible, blocked;
      if (perCraft) {
        convertible = Math.floor(inp.qty / perCraft);
        blocked = convertible < 1;
      } else {
        convertible = null;
        blocked = inp.qty < 5;
      }
      if (blocked) { recs.push({ chainLabel: chain.label, from: inp.name, fromQty: inp.qty, craft: out.name, toQty: out.qty, convertible: 0, blocked: true, score: 0, stageIndex: i }); continue; }
      const effective = convertible ?? inp.qty;
      const scarcity = effective / (out.qty + effective);
      const score = scarcity * Math.log10(effective + 1);
      recs.push({ chainLabel: chain.label, from: inp.name, fromQty: inp.qty, craft: out.name, toQty: out.qty, convertible, blocked: false, score, stageIndex: i });
    }
  }
  return recs.sort((a, b) => b.score - a.score);
}

// ─── Poll functions ───────────────────────────────────────────────────────
async function pollStorage() {
  if (!settlement) return;
  if (activeTab === 'storage') setTabContent('<div class="hint">Refreshing…</div>');
  try {
    const j = await bitwasp(`claims/${settlement.id}/inventories`);
    const im = {};
    for (const it of [...(j.items || []), ...(j.cargos || [])]) {
      im[it.id] = { name: it.name, tag: it.tag || '', icon: it.iconAssetName || '' };
      saveIcon(it.id, it.iconAssetName);
    }
    const totals = {};
    for (const b of (j.buildings || [])) {
      for (const slot of (b.inventory || [])) {
        const c = slot.contents;
        if (c?.item_id) totals[c.item_id] = (totals[c.item_id] || 0) + (c.quantity || 0);
      }
    }
    const ids = Object.keys(totals);
    itemsMap = {};
    for (const [id, m] of Object.entries(im)) itemsMap[id] = m.name;
    localStorage.setItem('bc-items-map', JSON.stringify(itemsMap));

    await batchFetchMeta(ids);

    allItems = ids.map(id => {
      const m = im[id] || { name: `#${id}`, tag: '', icon: '' };
      return { id, name: m.name, qty: totals[id], tag: m.tag, icon: m.icon };
    });
    chains = buildChainsFromMeta(allItems);
  } catch(e) { console.error('storage poll:', e); }
  if (activeTab === 'storage') renderTab('storage');
}

async function pollBuilds() {
  if (!settlement) return;
  try {
    const j = await bitwasp(`claims/${settlement.id}/construction`);
    buildsData = j.projects || [];
  } catch(e) { buildsData = []; console.error('builds poll:', e); }
  if (activeTab === 'builds') renderTab('builds');
}

async function pollJobs() {
  if (!settlement) return;
  try {
    const j = await bitwasp(`crafts?claimEntityId=${encodeURIComponent(settlement.id)}`);
    for (const it of (j.items || [])) itemsMap[it.id] = it.name;
    jobsData = (j.craftResults || []).filter(x => !x.completed);
  } catch(e) { jobsData = []; console.error('jobs poll:', e); }
  if (activeTab === 'jobs') renderTab('jobs');
}

async function pollMembers() {
  if (!settlement) return;
  try {
    const j = await bitwasp(`claims/${settlement.id}/citizens`);
    const citizens = j.citizens || [];
    membersData = await Promise.all(citizens.map(async c => {
      try {
        const pj = await bitwasp(`players?q=${encodeURIComponent(c.userName)}`);
        const p = (pj.players || []).find(pl => (pl.username || '').toLowerCase() === c.userName.toLowerCase());
        return { name: c.userName, online: !!p?.signedIn, last: p?.lastLoginTimestamp ?? null };
      } catch { return { name: c.userName, online: false, last: null }; }
    }));
  } catch(e) { membersData = []; console.error('members poll:', e); }
  updateOnlineBadge();
  if (activeTab === 'members') renderTab('members');
}

// ─── Traveler tasks ───────────────────────────────────────────────────────
async function resolveTasksPlayerId() {
  const name = localStorage.getItem('bc-tasks-player');
  if (!name) return null;
  const cached = localStorage.getItem('bc-tasks-player-id');
  if (cached) return cached;
  try {
    const j = await bitwasp(`players?q=${encodeURIComponent(name)}`);
    const p = (j.players || []).find(pl => (pl.username || '').toLowerCase() === name.toLowerCase());
    if (!p) return null;
    const id = String(p.entityId || '');
    if (id) localStorage.setItem('bc-tasks-player-id', id);
    return id || null;
  } catch { return null; }
}

async function getSkillMap() {
  if (_skillMap) return _skillMap;
  try {
    const j = await bitwasp('skills');
    const m = {};
    for (const cat of Object.values(j)) {
      if (Array.isArray(cat)) for (const s of cat) m[s.id] = s.name;
    }
    _skillMap = m;
  } catch { _skillMap = {}; }
  return _skillMap;
}

async function pollTasks() {
  if (!localStorage.getItem('bc-tasks-player')) { tasksData = null; if (activeTab === 'tasks') renderTab('tasks'); return; }
  const id = await resolveTasksPlayerId();
  if (!id) { tasksData = 'noplayer'; if (activeTab === 'tasks') renderTab('tasks'); return; }
  try {
    const [j, skillMap] = await Promise.all([ bitwasp(`players/${id}/traveler-tasks`), getSkillMap() ]);
    tasksData = {
      tasks: j.tasks || [],
      items: j.items || {},
      cargo: j.cargo || {},
      skillMap,
      expiration: j.expirationTimestamp || null,
    };
  } catch(e) { tasksData = { tasks: [], items: {}, cargo: {}, skillMap: {}, expiration: null }; console.error('tasks poll:', e); }
  if (activeTab === 'tasks') renderTab('tasks');
}

function taskItemName(td, ref) {
  const src = ref.item_type === 'cargo' ? td.cargo : td.items;
  const meta = src[ref.item_id] || td.items[ref.item_id] || td.cargo[ref.item_id];
  return meta ? meta.name : `#${ref.item_id}`;
}

function updateOnlineBadge() {
  const badge = document.getElementById('online-badge');
  if (!badge) return;
  const online = (membersData || []).filter(m => m.online).length;
  if (online > 0) { badge.textContent = online; badge.style.display = ''; }
  else badge.style.display = 'none';
}

function pollAll() {
  pollStorage();
  pollBuilds();
  pollJobs();
  pollMembers();
}

// ─── Tab rendering ────────────────────────────────────────────────────────
function setTabContent(html) {
  const el = document.getElementById('tab-content');
  if (el) el.innerHTML = html;
}

function renderTab(id) {
  const html = {
    storage:  renderStorage,
    builds:   renderBuilds,
    jobs:     renderJobs,
    tasks:    renderTasks,
    members:  renderMembers,
    settings: renderSettings,
  }[id]?.() || '';
  setTabContent(html);
  bindTabEvents(id);
}

function renderStorage() {
  let out = `<div class="mode-toggle">
    <button class="${storageMode==='plan'?'on':''}" data-mode="plan">Craft plan</button>
    <button class="${storageMode==='items'?'on':''}" data-mode="items">All items</button>
  </div>`;
  if (storageMode === 'plan') out += renderCraftPlan();
  else out += renderAllItems();
  return out;
}

function renderCraftPlan() {
  if (!allItems) return '<div class="hint">Loading inventory…</div>';
  // Keep the plan editor (search + goals) live, but hold the requirements
  // breakdown until the whole recipe tree has loaded.
  const body = window._planLoading ? '<div class="hint">Loading requirements…</div>' : renderByStage();
  return renderPlanEditor() + body;
}

async function doPlanSearch(q) {
  if (q.length < 2) { _planSearchResults = null; renderTab('storage'); return; }
  // No loading re-render — keeps input alive while typing
  try {
    const j = await bitwasp(`items?q=${encodeURIComponent(q)}`);
    if ((window._planSearch || '') !== q) return; // stale, discard
    const arr = j.items || j.results || (Array.isArray(j) ? j : []);
    const invById = Object.fromEntries((allItems || []).map(i => [String(i.id), i.qty]));
    _planSearchResults = arr.slice(0, 10).map(it => {
      const rid = String(it.id ?? it.entityId ?? it.item_id);
      saveIcon(rid, it.iconAssetName);
      return {
        id: rid,
        name: it.name || it.displayName || `#${it.id}`,
        qty: invById[rid] ?? 0,
        icon: it.iconAssetName || '',
      };
    });
    const map = JSON.parse(localStorage.getItem('bc-items-map') || '{}');
    let dirty = false;
    for (const r of _planSearchResults) { if (!map[r.id]) { map[r.id] = r.name; dirty = true; } }
    if (dirty) localStorage.setItem('bc-items-map', JSON.stringify(map));
  } catch(e) { _planSearchResults = []; }
  if ((window._planSearch || '') === q) renderTab('storage');
}

// Recursively fetch ALL ingredients in the recipe tree for a goal item.
async function ensureGoalTree(id, depth = 0, visited = new Set()) {
  if (depth > 15 || visited.has(id)) return;
  visited.add(id);
  const recipe = await fetchRecipe(id);
  if (!recipe?.ingredients?.length) return;
  // Fetch all ingredients in parallel (batched to respect rate limit)
  for (let i = 0; i < recipe.ingredients.length; i += 5) {
    const batch = recipe.ingredients.slice(i, i + 5);
    await Promise.all(batch.map(ing => ensureGoalTree(ing.id, depth + 1, visited)));
  }
}

// Fetch every goal's full recipe tree, showing a loading state until done so the
// craft plan never renders a half-resolved tree (placeholder names, missing icons).
let _planLoadInFlight = false;
async function loadGoalTrees() {
  if (_planLoadInFlight) return;
  const goals = Object.keys(craftGoals);
  if (!goals.length) { window._planLoading = false; return; }
  _planLoadInFlight = true;
  window._planLoading = true;
  if (activeTab === 'storage') renderTab('storage');
  try { await Promise.all(goals.map(id => ensureGoalTree(id))); }
  finally {
    _planLoadInFlight = false;
    window._planLoading = false;
    if (activeTab === 'storage') renderTab('storage');
  }
}

function computeNeeds() {
  if (!Object.keys(craftGoals).length) return {};
  const cache = recipeCache();
  const invById = Object.fromEntries((allItems || []).map(i => [i.id, i.qty]));
  const needs = {};

  function cascade(id, needed, visited = new Set()) {
    if (visited.has(id)) return;
    visited.add(id);
    needs[id] = (needs[id] || 0) + needed;
    const recipe = cache[id];
    if (!recipe?.ingredients?.length) return; // base material
    const haveQty = invById[id] || 0;
    const toCraft = Math.max(0, needed - haveQty);
    if (toCraft <= 0) return;
    const batches = Math.ceil(toCraft / (recipe.outputQty || 1));
    for (const ing of recipe.ingredients) {
      cascade(ing.id, ing.qty * batches, new Set(visited));
    }
  }

  for (const [id, qty] of Object.entries(craftGoals)) {
    if (qty > 0) cascade(id, qty);
  }
  return needs;
}

function renderByStage() {
  const needs = computeNeeds();
  if (!Object.keys(needs).length) return '';
  const cache = recipeCache();
  const nm = JSON.parse(localStorage.getItem('bc-items-map') || '{}');
  const icons = iconMap();
  const invById = Object.fromEntries((allItems || []).map(i => [i.id, i]));

  // Compute depth (0 = base material) from recipe tree
  const depthMemo = {};
  function depth(id, seen = new Set()) {
    if (id in depthMemo) return depthMemo[id];
    if (seen.has(id)) return 0;
    seen.add(id);
    const r = cache[id];
    if (!r?.ingredients?.length) return (depthMemo[id] = 0);
    const d = Math.max(...r.ingredients.map(ing => depth(ing.id, new Set(seen)))) + 1;
    return (depthMemo[id] = d);
  }

  const byStage = {};
  for (const id of Object.keys(needs)) {
    const inv = invById[id];
    const r = cache[id];
    const name = inv?.name || nm[id] || r?.name || `Item ${id.slice(-6)}`;
    const tag  = inv?.tag  || r?.tag  || 'Other';
    const qty  = inv?.qty  ?? 0;
    const s = depth(id);
    ((byStage[s] ??= {})[tag] ??= []).push({ id, name, qty });
  }
  if (!Object.keys(byStage).length) return '';

  const maxStage = Math.max(...Object.keys(byStage).map(Number));
  let html = '';
  for (let s = 0; s <= maxStage; s++) {
    if (!byStage[s]) continue;
    const groups = byStage[s];
    const total = Object.values(groups).reduce((n, g) => n + g.length, 0);
    const label = s === 0 ? 'Base Materials' : `Production Stage ${s}`;
    let inner = '';
    for (const [tag, items] of Object.entries(groups).sort()) {
      let rows = '';
      for (const item of items) {
        const need = needs[item.id] || 0;
        const ok   = item.qty >= need;
        rows += `<div class="cp-row">
          ${iconImg(icons[item.id] || invById[item.id]?.icon, 'item-icon cp-icon')}
          <span class="cp-name" title="${esc(item.name)}">${esc(item.name)}</span>
          <span class="cp-right"><span class="cp-need ${ok?'ok':'short'}">${fmt(item.qty)}/${fmt(need)}</span></span>
        </div>`;
      }
      inner += `<div class="cp-group">
        <div class="cp-gtag">${esc(tag)}<span class="cp-gbadge">${items.length}</span></div>
        ${rows}
      </div>`;
    }
    html += `<div class="cp-stage">
      <div class="cp-shd"><span>${esc(label)}</span><span class="cp-sbadge">${total} total</span></div>
      ${inner}
    </div>`;
  }
  return html;
}

function renderAllItems() {

      <button class="${sort === 'name' ? 'on' : ''}" data-sort="name">A–Z</button>

  </div>`;

}

function renderBuilds() {
  if (!buildsData) return '<div class="hint">Loading…</div>';
  if (!buildsData.length) return '<div class="hint">No active builds.</div>';
  const nameMap = JSON.parse(localStorage.getItem('bc-items-map') || '{}');
  return '<div class="builds">' + buildsData.map(p => {
    const req = p.actionsRequired || 0;
    const prog = p.progress || 0;
    const pct = req ? Math.round(prog / req * 100) : 0;
    const done = pct >= 100;
    const mats = [...(p.items || []), ...(p.cargos || [])].map(m => {
      const name = nameMap[m.item_id] || `#${m.item_id}`;
      return `<span class="need"><span>${esc(name)}</span><b>${fmt(m.quantity)}</b></span>`;
    }).join('');
    return `<div class="card">
      <div class="card-head">
        <span class="card-title">${esc(p.buildingName || p.recipeName || 'Build')}</span>
        <span class="card-pct${done?' pct-done':''}">${done?'done':pct+'%'}</span>
      </div>
      <div class="track"><span class="track-fill${done?' done':''}" style="width:${pct}%;display:block;height:100%;border-radius:3px"></span></div>
      ${mats ? `<div class="needs">${mats}</div>` : ''}

  }).join('') + '</div>';
}

function renderJobs() {
  if (!jobsData) return '<div class="hint">Loading…</div>';
  if (!jobsData.length) return '<div class="hint">No active crafts.</div>';
  return '<div class="jobs">' + jobsData.map(job => {
    const first = (job.craftedItem || [])[0];
    const id = first ? (first.item_id ?? first.id ?? first.entityId) : null;
    const name = (id && itemsMap[id]) ? itemsMap[id] : (job.recipeName || job.buildingName || 'Craft');
    const member = job.ownerUsername || job.memberName || '';
    const qty = job.craftCount || 0;
    const prog = job.progress || 0;
    const total = job.totalActionsRequired || 0;
    const pct = total > 0 ? Math.round(prog / total * 100) : 0;
    const done = pct >= 100;
    return `<div class="card">
      <div class="card-head">
        <span class="card-title">${esc(name)}${qty > 1 ? ` <span class="job-count">×${qty}</span>` : ''}</span>
        ${member ? `<span class="job-owner">${esc(member)}</span>` : ''}
        ${total > 0 ? `<span class="card-pct${done?' pct-done':''}">${done?'ready':pct+'%'}</span>` : ''}
      </div>
      ${total > 0 ? `<div class="track"><span class="track-fill${done?' done':''}" style="width:${pct}%;display:block;height:100%;border-radius:3px"></span></div>` : ''}
    </div>`;
  }).join('') + '</div>';
}

function renderTasks() {
  const name = localStorage.getItem('bc-tasks-player') || '';
  const setRow = `<div class="tk-setrow">
    <input class="inp tk-inp" id="tk-inp" placeholder="Your player name…" value="${esc(name)}" autocomplete="off">
    <button class="tk-setbtn" id="tk-setbtn">Set</button>
  </div>`;
  if (!name) return setRow + '<div class="hint">Set your player name to load traveler tasks.</div>';
  if (tasksData === null) { tasksData = 'loading'; setTimeout(pollTasks, 0); return setRow + '<div class="hint">Loading…</div>'; }
  if (tasksData === 'loading') return setRow + '<div class="hint">Loading…</div>';
  if (tasksData === 'noplayer') return setRow + `<div class="hint">Player “${esc(name)}” not found.</div>`;
  const td = tasksData;
  if (!td.tasks.length) return setRow + '<div class="hint">No active traveler tasks.</div>';
  const done = td.tasks.filter(t => t.completed).length;
  let expStr = '';
  if (td.expiration) {
    const ms = td.expiration * 1000 - Date.now();
    if (ms <= 0) expStr = 'expired';
    else { const h = Math.floor(ms / 3600000), d = Math.floor(h / 24); expStr = d > 0 ? `${d}d ${h%24}h` : `${h}h`; }
  }
  const head = `<div class="tk-head"><b>${done}</b>/${td.tasks.length} done${expStr ? ` · resets in ${expStr}` : ''}</div>`;
  const taskCard = t => {
    const reqs = (t.requiredItems || []).map(r => `${esc(taskItemName(td, r))} ×${fmt(r.quantity)}`).join(', ');
    const rewards = (t.rewardedItems || []).map(r => `${esc(taskItemName(td, r))} ×${fmt(r.quantity)}`).join(', ');
    const xp = t.rewardedExperience ? `+${fmt(t.rewardedExperience.quantity)} ${esc(td.skillMap[t.rewardedExperience.skill_id] || 'XP')}` : '';
    const lvl = t.levelRequirement;
    const lvlStr = lvl && lvl.min_level > 1 ? ` · lvl ${lvl.min_level}+ ${esc(td.skillMap[lvl.skill_id] || '')}` : '';
    return `<div class="task-card ${t.completed?'done':''}">
      <div class="task-desc">${t.completed ? '✓ ' : ''}${esc(t.description)}</div>
      <div class="task-meta">
        <span class="task-need">Need: ${reqs}${lvlStr}</span>
        <span class="task-reward">→ ${rewards}${xp ? ` · ${xp}` : ''}</span>
      </div>
    </div>`;
  };
  // Group by NPC — the traveler's name is the first word of the description
  const npcOf = t => (t.description || '').split(' ')[0] || `Traveler ${t.travelerId}`;
  const groups = {};
  for (const t of td.tasks) (groups[npcOf(t)] = groups[npcOf(t)] || []).push(t);
  const body = Object.keys(groups).sort((a, b) => a.localeCompare(b)).map(npc => {
    const list = groups[npc].sort((a, b) => (a.completed?1:0) - (b.completed?1:0));
    const ndone = list.filter(t => t.completed).length;
    return `<div class="tk-npc">${esc(npc)}<span class="tk-npc-count">${ndone}/${list.length}</span></div>` + list.map(taskCard).join('');
  }).join('');
  return setRow + head + '<div class="tasks">' + body + '</div>';
}

function renderMembers() {
  if (!membersData) return '<div class="hint">Loading…</div>';
  if (!membersData.length) return '<div class="hint">No members found.</div>';
  const sorted = [...membersData].sort((a, b) => {

    return a.name.localeCompare(b.name);

  const online = sorted.filter(m => m.online).length;
  return `<div class="members">
    <div class="members-count"><b>${online}</b> of ${sorted.length} online</div>
    ${sorted.map(m => {
      const st = m.online ? 'online' : m.last ? relTime(m.last) : 'offline';
      return `<div class="m-row">

        <span class="m-name">${esc(m.name)}</span>
        <span class="m-status">${esc(st)}</span>

}

// ─── Event binding ────────────────────────────────────────────────────────
function bindTabEvents(id) {
  if (id === 'storage') {
    document.querySelectorAll('.mode-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        storageMode = btn.dataset.mode;
        renderTab('storage');
      });
    });
    if (storageMode === 'plan') bindGoalEvents();
    if (storageMode === 'items') bindAllItemsEvents();
  }
  if (id === 'tasks') {
    const inp = document.getElementById('tk-inp');
    const btn = document.getElementById('tk-setbtn');
    if (inp) inp.addEventListener('mousedown', e => e.stopPropagation());
    const apply = () => {
      const v = inp.value.trim();
      if (!v) {
        localStorage.removeItem('bc-tasks-player');
        localStorage.removeItem('bc-tasks-player-id');
        tasksData = null;
      } else {
        localStorage.setItem('bc-tasks-player', v);
        localStorage.removeItem('bc-tasks-player-id'); // force re-lookup
        tasksData = 'loading';
      }
      renderTab('tasks');
      pollTasks();
    };
    if (btn) btn.addEventListener('click', apply);
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
  }
  if (id === 'settings') {
    const inp = document.getElementById('cfg-player');
    const saveBtn = document.getElementById('cfg-player-save');
    if (inp) inp.addEventListener('mousedown', e => e.stopPropagation());
    const apply = () => {
      const v = inp.value.trim();
      if (!v) {
        localStorage.removeItem('bc-tasks-player');
        localStorage.removeItem('bc-tasks-player-id');
      } else {
        localStorage.setItem('bc-tasks-player', v);
        localStorage.removeItem('bc-tasks-player-id');
      }
      tasksData = null;
      saveBtn.textContent = 'Saved!';
      setTimeout(() => { saveBtn.textContent = 'Save'; }, 1500);
    };
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
    if (saveBtn) saveBtn.addEventListener('click', apply);
    const changeBtn = document.getElementById('cfg-change-sett');
    if (changeBtn) changeBtn.addEventListener('click', () => {
      setSettlement(null); settlement = null;
      allItems = null; chains = null; buildsData = null; jobsData = null; membersData = null;
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').innerHTML = '';
      showView('setup');
    });
  }
}

function bindGoalEvents() {
  const searchInp = document.getElementById('plan-search');
  if (searchInp) {
    searchInp.addEventListener('mousedown', e => e.stopPropagation());
    searchInp.addEventListener('input', e => {
      window._planSearch = e.target.value;
      _planSearchResults = null;
      doPlanSearch(e.target.value);
    });
    if (window._planSearch) {
      searchInp.focus();
      const len = searchInp.value.length;
      searchInp.setSelectionRange(len, len);
    }
  }
  document.querySelectorAll('.plan-result').forEach(el => {
    el.addEventListener('mousedown', e => e.preventDefault());
    el.addEventListener('click', async () => {
      const id = el.dataset.id;
      if (!craftGoals[id]) craftGoals[id] = 1;
      window._planSearch = '';
      _planSearchResults = null;
      localStorage.setItem('bc-goals', JSON.stringify(craftGoals));
      // Show loading, fetch full recipe tree, then reveal the requirements.
      window._planLoading = true;
      renderTab('storage');
      await ensureGoalTree(id);
      window._planLoading = false;
      renderTab('storage');
    });
  });
  document.querySelectorAll('.plan-qty').forEach(inp => {
    inp.addEventListener('mousedown', e => e.stopPropagation());
    inp.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const val = parseInt(e.target.value) || 1;
      craftGoals[id] = Math.max(1, val);
      localStorage.setItem('bc-goals', JSON.stringify(craftGoals));
      renderTab('storage');
    });
  });
  document.querySelectorAll('.plan-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      delete craftGoals[btn.dataset.id];
      localStorage.setItem('bc-goals', JSON.stringify(craftGoals));
      renderTab('storage');
    });
  });
  const clearBtn = document.querySelector('.cp-clear-goals');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    craftGoals = {};
    window._planSearch = '';
    _planSearchResults = null;
    localStorage.removeItem('bc-goals');
    renderTab('storage');
  });
  // Load recipe trees for any goals not yet cached (guarded against re-entry).
  const needLoad = Object.keys(craftGoals).some(id => !(id in recipeCache()));
  if (needLoad) loadGoalTrees();
}

function bindAllItemsEvents() {
  const inp = document.getElementById('ai-search');
  if (inp) {
    inp.addEventListener('input', e => { window._aiSearch = e.target.value; renderTab('storage'); });
    inp.focus();
  }
  document.querySelectorAll('.seg button').forEach(btn => {
    btn.addEventListener('click', () => { window._aiSort = btn.dataset.sort; renderTab('storage'); });
  });
}

// ─── App init ─────────────────────────────────────────────────────────────
function showView(id) {
  document.getElementById('view-setup').style.display = id === 'setup' ? '' : 'none';
  document.getElementById('view-main').style.display  = id === 'main'  ? '' : 'none';
}

function startMain() {
  document.getElementById('settlement-label').textContent = settlement.name;
  document.getElementById('settlement-tier').style.display = 'none';
  showView('main');
  // If any goal's recipe tree isn't cached yet, start in the loading state so the
  // craft plan doesn't flash a half-resolved tree before loadGoalTrees() kicks in.
  window._planLoading = Object.keys(craftGoals).some(id => !(id in recipeCache()));
  renderTab(activeTab);
  pollAll();
  startPollClock(5000);
  setInterval(() => { pollBuilds(); pollJobs(); pollMembers(); pollTasks(); }, 5000);
}

// Settlement search
async function search() {
  const q = document.getElementById('search-input').value.trim();
  if (q.length < 2) return;
  const res = document.getElementById('search-results');
  res.innerHTML = '<div class="hint">Searching…</div>';
  try {
    const j = await bitwasp(`claims?q=${encodeURIComponent(q)}&limit=8`);
    const hits = j.claims || [];
    if (!hits.length) { res.innerHTML = '<div class="hint">No settlements found.</div>'; return; }
    res.innerHTML = hits.map(c =>
      `<div class="search-result">
        <span class="res-name">${esc(c.name)}</span>
        <button class="res-pick" data-id="${c.entityId}" data-name="${esc(c.name)}">Select</button>
      </div>`
    ).join('');
    res.querySelectorAll('.res-pick').forEach(btn => btn.addEventListener('click', () => {
      settlement = { id: btn.dataset.id, name: btn.dataset.name };
      setSettlement(settlement);
      startMain();
    }));
  } catch(e) { res.innerHTML = `<div class="hint" style="color:var(--bad)">${esc(String(e))}</div>`; }
}

// Tab switching
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  const id = btn.dataset.tab;
  if (id === activeTab) return;
  activeTab = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === id));
  renderTab(id);
  if (id === 'builds') pollBuilds();
  if (id === 'jobs') pollJobs();
  if (id === 'members' && !membersData) pollMembers();
});

// Window chrome — T is declared in common.js
let win = T?.window?.getCurrentWindow?.();

document.getElementById('drag-bar-main').addEventListener('mousedown', e => {
  if (e.button === 0 && !e.target.closest('.winbtn')) win?.startDragging?.();
});
document.getElementById('drag-bar-setup').addEventListener('mousedown', e => {
  if (e.button === 0 && !e.target.closest('.winbtn')) win?.startDragging?.();
});
document.getElementById('close-btn-main').addEventListener('click', () => win?.close?.());
document.getElementById('close-btn-setup').addEventListener('click', () => win?.close?.());
document.getElementById('min-btn').addEventListener('click', () => win?.minimize?.());
document.getElementById('search-btn').addEventListener('click', search);
document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

// Save position
if (win) {
  let _posTimer;
  win.listen('tauri://move', () => {
    clearTimeout(_posTimer);
    _posTimer = setTimeout(async () => {
      try {
        const pos = await win.outerPosition();
        const sf = await win.scaleFactor();
        localStorage.setItem('bc-pos-main', JSON.stringify({ x: Math.round(pos.x / sf), y: Math.round(pos.y / sf) }));
      } catch {}
    }, 400);
  });
}

// Collapse
document.getElementById('collapse-btn').addEventListener('click', async () => {
  const btn = document.getElementById('collapse-btn');
  const col = document.getElementById('main-collapsible');
  const isCollapsed = btn.textContent.trim() === '▼';
  if (isCollapsed) {
    const h = parseInt(localStorage.getItem('bc-h-main') || '500');
    await T?.core?.invoke('set_window_size', { width: 360, height: h });
    btn.textContent = '▲';
    col.style.display = '';
  } else {
    if (!win) { btn.textContent = '▼'; col.style.display = 'none'; return; }
    const sz = await win.innerSize();
    const sf = await win.scaleFactor();
    localStorage.setItem('bc-h-main', Math.round(sz.height / sf));
    await T?.core?.invoke('set_window_size', { width: 360, height: 34 });
    btn.textContent = '▼';
    col.style.display = 'none';
  }
});

// Focus watcher
(async () => {
  if (!win) return;
  await win.setAlwaysOnTop(true);
  setInterval(async () => {
    try {
      const active = await T.core.invoke('is_game_focused');
      await win.setAlwaysOnTop(active);
    } catch {}
  }, 700);
})();

// Boot
if (settlement) startMain();
else showView('setup');
checkForUpdate();
</script>
</body>
</html>
