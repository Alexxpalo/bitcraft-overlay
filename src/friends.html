<!DOCTYPE html>
<html lang="en" style="background:#080b10">
<head>
  <meta charset="UTF-8">
  <title>Friends</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div id="drag-bar">
    <span class="status-dot" id="status-dot" title="…"></span>
    <span class="logo">FRIENDS</span>
    <span class="spacer"></span>
    <span class="win-btn pin active" id="pin-btn" title="Always on top">📌</span>
    <span class="win-btn" id="collapse-btn" title="Collapse/expand">&#x25B2;</span>
    <span class="win-btn" id="min-btn" title="Minimize">&#x2013;</span>
    <span class="win-btn close" id="close-btn" title="Close">&#x2715;</span>
  </div>
  <div class="body collapsible">
    <div class="addrow">
      <input id="name-input" placeholder="Friend's username..." />
      <button class="act" id="add-btn">Watch</button>
    </div>
    <div id="list"></div>
  </div>
  <script src="common.js"></script>
  <script src="friends.js"></script>
</body>
</html>
