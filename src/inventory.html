<!DOCTYPE html>
<html lang="en" style="background:#080b10">
<head>
  <meta charset="UTF-8">
  <title>Inventory</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .inv-ctrl { display: flex; flex-direction: column; gap: 4px; margin-bottom: 5px; }
    .sort-btns { display: flex; gap: 3px; }
    .sort-btn {
      -webkit-appearance: none; appearance: none;
      flex: 1; padding: 2px 0; background: #0d1520; border: 1px solid #1a2535;
      border-radius: 3px; color: #3a5070; font-size: 10px; cursor: pointer;
      box-sizing: border-box;
    }
    .sort-btn:hover  { border-color: #3a7bd5; color: #90b8f0; }
    .sort-btn.active { border-color: #3a7bd5; color: #3a7bd5; background: #0d1e35; }
    .qty { font-size: 11px; color: #90b8f0; flex-shrink: 0; }
    select {
      background: #131820; border: 1px solid #202a3a; border-radius: 3px;
      color: #c8d4e0; padding: 3px 6px; font-size: 11px; outline: none; width: 100%;
    }
    select:focus { border-color: #3a7bd5; }
  </style>
</head>
<body>
  <div id="drag-bar">
    <span class="status-dot" id="status-dot" title="…"></span>
    <span class="logo">INVENTORY</span>
    <span class="spacer"></span>
    <span class="win-btn" id="collapse-btn" title="Collapse/expand">&#x25B2;</span>
    <span class="win-btn" id="min-btn" title="Minimize">&#x2013;</span>
    <span class="win-btn close" id="close-btn" title="Close">&#x2715;</span>
  </div>
  <div class="body collapsible">
    <div class="inv-ctrl">
      <input id="inv-search" placeholder="Search items…" autocomplete="off" />
      <div id="inv-sort" class="sort-btns">
        <button class="sort-btn active" data-sort="name-asc">A→Z</button>
        <button class="sort-btn" data-sort="name-desc">Z→A</button>
        <button class="sort-btn" data-sort="qty-desc">Qty ↓</button>
        <button class="sort-btn" data-sort="qty-asc">Qty ↑</button>
      </div>
      <div style="display:flex;gap:4px">
        <select id="group-filter" style="flex:1">
          <option value="">All</option>
        </select>
        <select id="tag-filter" style="flex:1">
          <option value="">All stages</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
  </div>
  <script src="common.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
