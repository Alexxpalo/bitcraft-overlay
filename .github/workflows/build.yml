name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BitCraft Overlay ${{ github.ref_name }}"
          releaseBody: "Lataa asennuspaketti alla olevista tiedostoista."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Upload Linux updater files
        if: matrix.os == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for f in src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz \
                    src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber || true
          done

      - name: Upload Windows updater files
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          foreach ($bundle in @("nsis", "msi")) {
            $dir = "src-tauri/target/release/bundle/$bundle"
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -Include "*.zip","*.zip.sig" |
                ForEach-Object { gh release upload $tag $_.FullName --clobber 2>$null }
            }
          }

  updater-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          mkdir -p /tmp/sigs

          gh release download "$TAG" --repo "$REPO" \
            --pattern "*.AppImage.tar.gz.sig" \
            --pattern "*.nsis.zip.sig" \
            --pattern "*.msi.zip.sig" \
            --dir /tmp/sigs 2>/dev/null || true

          LINUX_SIG_FILE=$(ls /tmp/sigs/*.AppImage.tar.gz.sig 2>/dev/null | head -1)
          WIN_SIG_FILE=$(ls /tmp/sigs/*.nsis.zip.sig /tmp/sigs/*.msi.zip.sig 2>/dev/null | head -1)

          LINUX_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith(".AppImage.tar.gz")) | .browserDownloadUrl' | head -1)
          WIN_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | (endswith(".nsis.zip") or endswith(".msi.zip"))) | .browserDownloadUrl' | head -1)

          echo "Linux sig: $LINUX_SIG_FILE"
          echo "Windows sig: $WIN_SIG_FILE"

          PLATFORMS="{}"

          if [ -f "$LINUX_SIG_FILE" ] && [ -n "$LINUX_URL" ]; then
            LINUX_SIG=$(cat "$LINUX_SIG_FILE")
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg sig "$LINUX_SIG" --arg url "$LINUX_URL" \
              '. + {"linux-x86_64": {"signature": $sig, "url": $url}}')
          fi

          if [ -f "$WIN_SIG_FILE" ] && [ -n "$WIN_URL" ]; then
            WIN_SIG=$(cat "$WIN_SIG_FILE")
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg sig "$WIN_SIG" --arg url "$WIN_URL" \
              '. + {"windows-x86_64": {"signature": $sig, "url": $url}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{"version": $version, "notes": "See release page.", "pub_date": $pub_date, "platforms": $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
