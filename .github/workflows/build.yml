name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BitCraft Overlay ${{ github.ref_name }}"
          releaseBody: "Lataa asennuspaketti alla olevista tiedostoista."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

  updater-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          mkdir -p /tmp/sigs

          # Tauri 2.0 (createUpdaterArtifacts) signs the installers directly.
          # The updater resolves the download per install type: it looks up
          # "{os}-{arch}-{installer}" first and falls back to "{os}-{arch}".
          # So a .deb install MUST be offered the .deb (not the AppImage) or it
          # fails with "invalid updater binary format". We therefore publish a
          # key per Linux package format, plus the AppImage as the generic
          # linux-x86_64 fallback, and the NSIS zip for Windows.
          gh release download "$TAG" --repo "$REPO" \
            --pattern "*.AppImage.tar.gz.sig" \
            --pattern "*_amd64.deb.sig" \
            --pattern "*.x86_64.rpm.sig" \
            --pattern "*-setup.nsis.zip.sig" \
            --dir /tmp/sigs 2>/dev/null || true

          APPIMAGE_SIG_FILE=$(ls /tmp/sigs/*.AppImage.tar.gz.sig 2>/dev/null | head -1)
          DEB_SIG_FILE=$(ls /tmp/sigs/*_amd64.deb.sig 2>/dev/null | head -1)
          RPM_SIG_FILE=$(ls /tmp/sigs/*.x86_64.rpm.sig 2>/dev/null | head -1)
          WIN_SIG_FILE=$(ls /tmp/sigs/*-setup.nsis.zip.sig 2>/dev/null | head -1)

          APPIMAGE_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith(".AppImage.tar.gz")) | .url' | head -1)
          DEB_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith(".deb")) | .url' | head -1)
          RPM_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith(".rpm")) | .url' | head -1)
          WIN_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith("-setup.nsis.zip")) | .url' | head -1)

          echo "AppImage sig: $APPIMAGE_SIG_FILE  url: $APPIMAGE_URL"
          echo "Deb      sig: $DEB_SIG_FILE  url: $DEB_URL"
          echo "Rpm      sig: $RPM_SIG_FILE  url: $RPM_URL"
          echo "Windows  sig: $WIN_SIG_FILE  url: $WIN_URL"

          PLATFORMS="{}"

          # add_platform <key> <sig_file> <url>
          add_platform() {
            local key="$1" sig_file="$2" url="$3"
            if [ -f "$sig_file" ] && [ -n "$url" ]; then
              PLATFORMS=$(echo "$PLATFORMS" | jq \
                --arg key "$key" --arg sig "$(cat "$sig_file")" --arg url "$url" \
                '. + {($key): {"signature": $sig, "url": $url}}')
            else
              echo "WARN: skipping $key (missing sig or url)" >&2
            fi
          }

          # Generic linux fallback = AppImage (used by AppImage installs).
          add_platform "linux-x86_64"     "$APPIMAGE_SIG_FILE" "$APPIMAGE_URL"
          # Per-installer keys so .deb / .rpm installs self-update correctly.
          add_platform "linux-x86_64-deb" "$DEB_SIG_FILE"      "$DEB_URL"
          add_platform "linux-x86_64-rpm" "$RPM_SIG_FILE"      "$RPM_URL"
          add_platform "windows-x86_64"   "$WIN_SIG_FILE"      "$WIN_URL"

          if [ "$PLATFORMS" = "{}" ]; then
            echo "ERROR: no updater platforms resolved — auto-update would be broken" >&2
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{"version": $version, "notes": "See release page.", "pub_date": $pub_date, "platforms": $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
